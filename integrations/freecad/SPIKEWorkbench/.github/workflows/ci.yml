name: Workbench checks

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  standalone:
    name: Python ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Unit and contract checks
        run: python -m unittest discover -s tests -v
      - name: Build install and source ZIPs
        run: |
          python tools/package.py --kind install --output dist/SPIKEWorkbench-install.zip
          python tools/package.py --kind source --output dist/SPIKEWorkbench-source.zip
      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: spike-freecad-${{ matrix.os }}
          path: dist/*.zip
          if-no-files-found: error
