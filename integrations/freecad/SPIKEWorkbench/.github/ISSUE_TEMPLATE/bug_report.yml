name: Bug report
description: Report a reproducible FreeCAD workbench problem
title: "[Bug] "
labels: [bug]
body:
  - type: input
    id: freecad
    attributes:
      label: FreeCAD version and operating system
      placeholder: "FreeCAD 1.1.3 on Windows 11"
    validations:
      required: true
  - type: input
    id: spike
    attributes:
      label: SPIKE worker version or checkout
      description: Include the exact commit if using a source checkout.
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use a redistributable minimal board or contract fixture. Remove local paths and private designs.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual result
      description: Include status, model_status, units, and diagnostics where relevant.
    validations:
      required: true
