name: Publish verified platform packages
on:
  workflow_dispatch:
    inputs:
      linux_run:
        description: Verified Linux build run ID
        required: true
      macos_run:
        description: Verified macOS build run ID
        required: true
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      LINUX_RUN: ${{ inputs.linux_run }}
      MACOS_RUN: ${{ inputs.macos_run }}
    steps:
      - name: Download verified packages
        run: |
          gh run download "$LINUX_RUN" --pattern 'SPIKE-*' --dir linux
          gh run download "$MACOS_RUN" --pattern 'SPIKE-*' --dir macos
      - name: Check hashes and publish
        shell: python
        run: |
          import hashlib
          from pathlib import Path
          import subprocess
          assets = []
          packages = [*Path('linux').rglob('*.flatpak'), *Path('macos').rglob('*.dmg')]
          assert len(packages) == 3, 'Expected one Flatpak and two DMGs'
          for package in packages:
              checksum = package.with_suffix(package.suffix + '.sha256')
              expected, name = checksum.read_text().strip().split(maxsplit=1)
              assert name == package.name
              assert hashlib.file_digest(package.open('rb'), 'sha256').hexdigest() == expected
              assets.extend([str(package), str(checksum)])
          subprocess.run(['gh', 'release', 'upload', 'v0.3.0', *assets, '--clobber'], check=True)
