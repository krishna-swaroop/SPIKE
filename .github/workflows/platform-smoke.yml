name: Packaged desktop smoke checks
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platforms to check
        type: choice
        default: all
        options: [all, linux, macos]
      linux_run:
        description: Linux package workflow run ID
        required: true
      macos_run:
        description: macOS package workflow run ID
        required: true
permissions:
  contents: read
  actions: read
jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platform == 'linux' && '["ubuntu-24.04"]' || inputs.platform == 'macos' && '["macos-15","macos-15-intel"]' || '["ubuntu-24.04","macos-15","macos-15-intel"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux desktop
        if: runner.os == 'Linux'
        env:
          PACKAGE_RUN: ${{ inputs.linux_run }}
        run: |
          artifact=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PACKAGE_RUN/artifacts" --jq '.artifacts[] | select(.name | test("linux|ubuntu")) | .name')
          gh run download "$PACKAGE_RUN" --name "$artifact" --dir packages
          sudo apt-get update
          sudo apt-get install -y flatpak xvfb dbus-x11
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive -y packages/*.flatpak
          python scripts/smoke_desktop_package.py xvfb-run -a dbus-run-session -- flatpak run org.spike.integrity
      - name: macOS desktop
        if: runner.os == 'macOS'
        env:
          PACKAGE_RUN: ${{ inputs.macos_run }}
          ARTIFACT: SPIKE-${{ matrix.os }}
        run: |
          gh run download "$PACKAGE_RUN" --name "$ARTIFACT" --dir packages
          hdiutil attach packages/*.dmg -nobrowse -mountpoint "$RUNNER_TEMP/spike-dmg"
          python scripts/smoke_desktop_package.py "$RUNNER_TEMP/spike-dmg/SPIKE.app/Contents/MacOS/spike-desktop"
          hdiutil detach "$RUNNER_TEMP/spike-dmg"
