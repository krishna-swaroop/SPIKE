name: Windows x64 package

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      verified_run_id:
        description: Successful Windows package run to publish (empty builds only)
        type: string
        default: ''
      release_commit:
        description: Exact reviewed commit used by that Windows build
        type: string
        default: ''
      human_review_complete:
        description: Required maintainer and numerical review is complete
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    if: inputs.verified_run_id == ''
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-build-windows-x64.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: false
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
      - name: Build, install, and verify Windows package
        shell: powershell
        run: ./scripts/build_windows_ci.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: SPIKE-windows-x64
          path: dist-release/*
          if-no-files-found: error
          retention-days: 14
  publish-verified:
    if: github.event_name == 'workflow_dispatch' && inputs.verified_run_id != '' && inputs.human_review_complete
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: SPIKE-windows-x64
          path: dist-release
          run-id: ${{ inputs.verified_run_id }}
          github-token: ${{ github.token }}
      - name: Verify build identity and publish reviewed Windows preview
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_WINDOWS_RUN: ${{ inputs.verified_run_id }}
          REVIEWED_RELEASE_COMMIT: ${{ inputs.release_commit }}
        run: python scripts/publish_verified_windows.py
